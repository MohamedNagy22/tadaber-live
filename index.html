<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="تدابير للمقاولات العامة والتشطيبات - موقعنا قريباً">
  <title>تدابير | قريباً</title>
  <style>
    @font-face {
      font-family: "Cairo";
      src: url("./fonts/CAIRO-SEMIBOLD.TTF") format("truetype");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --ink: #201f1f;
      --muted: #666461;
      --gold: #bd955b;
      --gold-soft: #d4b47f;
      --paper: #f7f5f1;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; width: 100%; height: 100%; }

    body {
      min-width: 320px;
      overflow: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: "Cairo", sans-serif;
      font-weight: 600;
    }

    .page {
      position: relative;
      isolation: isolate;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: clamp(12px, 2vh, 24px) 4vw;
      background: url("./imgs/page-bg.webp") right bottom / 100% 100% no-repeat;
    }

    .page::before,
    .page::after {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;
    }

    .page::after {
      inset: 0;
      background: radial-gradient(ellipse at 51% 50%, rgba(255,255,255,.78) 0 23%, rgba(255,255,255,.3) 44%, transparent 68%);
    }

    .content {
      width: min(760px, 62vw);
      margin-inline: auto;
      transform: translateX(-1vw);
      text-align: center;
    }

    .logo {
      display: block;
      width: clamp(188px, 16vw, 245px);
      max-height: 235px;
      object-fit: contain;
      margin: 0 auto clamp(18px, 2.4vh, 30px);
    }

    h1 {
      display: inline-block;
      margin: 0;
      font-size: clamp(62px, 6.1vw, 94px);
      line-height: 1.2;
      letter-spacing: 0;
      color: var(--ink);
      background: linear-gradient(90deg, var(--ink) 0 51%, #a77e45 66%, #d1a35f 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .rule {
      position: relative;
      height: 1px;
      width: min(430px, 73%);
      margin: 24px auto 17px;
      background: linear-gradient(90deg, transparent, var(--gold-soft) 18%, var(--gold-soft) 82%, transparent);
    }

    .rule::after {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      border: 6px solid transparent;
      border-top-color: var(--gold);
      transform: translateX(-50%);
    }

    .lead {
      margin: 0 0 5px;
      font-size: clamp(20px, 1.8vw, 28px);
      line-height: 1.55;
    }

    .sublead {
      margin: 0;
      color: var(--muted);
      font-size: clamp(16px, 1.45vw, 22px);
      line-height: 1.7;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      direction: ltr;
      margin: clamp(28px, 4.5vh, 48px) auto clamp(28px, 4vh, 44px);
      padding: 0;
      list-style: none;
    }

    .feature {
      position: relative;
      direction: rtl;
      display: grid;
      align-content: start;
      justify-items: center;
      gap: 9px;
      min-width: 0;
      padding: 0 16px;
      font-size: clamp(13px, 1.05vw, 17px);
      white-space: nowrap;
    }

    .feature:not(:last-child)::after {
      content: "";
      position: absolute;
      top: 1px;
      bottom: 1px;
      right: 0;
      width: 1px;
      background: linear-gradient(transparent, rgba(189,149,91,.62) 17% 83%, transparent);
    }

    .feature svg {
      width: 50px;
      height: 50px;
      fill: none;
      stroke: var(--gold);
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .follow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin-bottom: 16px;
      font-size: 17px;
    }

    .follow::before, .follow::after {
      content: "";
      width: 122px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    .follow::after { transform: scaleX(-1); }

    .socials { display: flex; direction: ltr; justify-content: center; gap: 38px; }

    .socials a {
      display: grid;
      place-items: center;
      width: 47px;
      height: 47px;
      color: var(--gold);
      border: 2px solid var(--gold);
      border-radius: 50%;
      transition: color .2s, background-color .2s, transform .2s;
    }

    .socials a:hover, .socials a:focus-visible {
      color: #fff;
      background: var(--gold);
      transform: translateY(-2px);
      outline: none;
    }

    .socials svg { width: 25px; height: 25px; fill: currentColor; }

    @media (max-height: 850px) and (min-width: 701px) {
      .logo { width: 180px; max-height: 175px; margin-bottom: 12px; }
      h1 { font-size: 68px; }
      .rule { margin-block: 14px 10px; }
      .lead { font-size: 20px; line-height: 1.4; }
      .sublead { font-size: 16px; line-height: 1.5; }
      .features { margin-block: 20px; }
      .feature { gap: 5px; }
      .feature svg { width: 42px; height: 42px; }
      .follow { margin-bottom: 10px; }
      .socials a { width: 40px; height: 40px; }
      .socials svg { width: 21px; height: 21px; }
    }

    @media (max-width: 980px) {
      .page { background-position: 68% bottom; }
      .page::before { left: -27%; width: 39%; opacity: .95; }
      .content { width: min(700px, 78vw); transform: none; }
    }

    @media (max-width: 700px) {
      .page {
        place-items: center;
        padding: 14px 18px;
        background:
          linear-gradient(rgba(247,245,241,.92), rgba(247,245,241,.84)),
          url("./imgs/page-bg.webp") 72% bottom / auto 68% no-repeat;
      }
    
      .page::after { opacity: .55; }
      .content { width: min(540px, 100%); }
      .logo { width: min(165px, 39vw); max-height: 145px; margin-bottom: 10px; }
      h1 { font-size: clamp(52px, 17vw, 72px); }
      .rule { margin-block: 10px 5px; }
      .features { grid-template-columns: repeat(2, 1fr); row-gap: 14px; margin-block: 18px; }
      .feature svg { width: 42px; height: 42px; }
      .follow { margin-bottom: 10px; }
      .socials a { width: 41px; height: 41px; }
      .feature { white-space: normal; line-height: 1.5; }
      .feature:nth-child(even)::after { display: none; }
      .socials { gap: 27px; }
    }

    @media (max-width: 390px) {
      .features { grid-template-columns: 1fr; gap: 17px; }
      .feature { grid-template-columns: 42px auto; align-items: center; justify-content: center; }
      .feature::after { display: none; }
      .feature svg { width: 40px; height: 40px; }
      .follow { gap: 12px; }
      .follow::before, .follow::after { width: 65px; }
    }
  </style>
</head>
<body>

    </section>
  </main>
</body>
</html>
